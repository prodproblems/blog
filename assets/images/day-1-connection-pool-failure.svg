<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" rx="18" fill="#0b1420"/><rect x="2" y="2" width="1196" height="296" rx="16" fill="none" stroke="#334155"/><text x="34" y="48" fill="#a3f36b" font-family="Arial,sans-serif" font-size="18" font-weight="700">02 / WHY THE API FAILS</text><text x="34" y="80" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Slow query → connections occupied → requests queue</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="125" width="215" height="105" rx="10" fill="#121f2e" stroke="#64748b"/><text x="147" y="160" fill="#f8fafc" font-size="19" font-weight="700">Slow SQL query</text><text x="147" y="187" fill="#ff817c" font-size="17">~5 seconds</text><text x="147" y="210" fill="#94a3b8" font-size="14">holds each connection</text><path d="M255 177 H315" stroke="#ff625f" stroke-width="4"/><path d="M303 167 L315 177 L303 187" fill="none" stroke="#ff625f" stroke-width="4"/><rect x="315" y="115" width="370" height="125" rx="10" fill="#171b26" stroke="#ff625f" stroke-width="2"/><text x="500" y="143" fill="#f8fafc" font-size="19" font-weight="700">Database connection pool</text><g fill="#ff625f" stroke="#fecaca" stroke-width="1"><rect x="342" y="160" width="42" height="24" rx="4"/><rect x="392" y="160" width="42" height="24" rx="4"/><rect x="442" y="160" width="42" height="24" rx="4"/><rect x="492" y="160" width="42" height="24" rx="4"/><rect x="542" y="160" width="42" height="24" rx="4"/><rect x="592" y="160" width="42" height="24" rx="4"/></g><text x="500" y="211" fill="#ff817c" font-size="17" font-weight="700">50 / 50 connections in use</text><path d="M685 177 H750" stroke="#ff625f" stroke-width="4"/><path d="M738 167 L750 177 L738 187" fill="none" stroke="#ff625f" stroke-width="4"/><rect x="750" y="125" width="185" height="105" rx="10" fill="#121f2e" stroke="#64748b"/><text x="842" y="162" fill="#f8fafc" font-size="19" font-weight="700">Request queue</text><text x="842" y="190" fill="#fbbf24" font-size="16">Waiting...</text><path d="M935 177 H985" stroke="#ff625f" stroke-width="4"/><path d="M973 167 L985 177 L973 187" fill="none" stroke="#ff625f" stroke-width="4"/><rect x="985" y="125" width="175" height="105" rx="10" fill="#24191f" stroke="#ff625f" stroke-width="2"/><text x="1072" y="164" fill="#ff817c" font-size="19" font-weight="700">API timeout</text><text x="1072" y="194" fill="#f8fafc" font-size="18">504</text></g><text x="40" y="270" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">A database can still accept connections and yet be overloaded or blocked by slow work.</text></svg>