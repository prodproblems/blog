<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><rect width="1200" height="340" rx="18" fill="#0b1420"/><rect x="2" y="2" width="1196" height="336" rx="16" fill="none" stroke="#334155"/><text x="34" y="48" fill="#a3f36b" font-family="Arial,sans-serif" font-size="18" font-weight="700">03 / MITIGATION, FIX AND PREVENTION</text><text x="34" y="80" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Stabilize first. Prove the cause. Prevent recurrence.</text><g font-family="Arial,sans-serif"><rect x="35" y="112" width="350" height="185" rx="12" fill="#211b21" stroke="#ff625f"/><text x="58" y="147" fill="#ff817c" font-size="21" font-weight="700">1. Mitigate now</text><text x="58" y="180" fill="#f8fafc" font-size="17">• Roll back if release-related</text><text x="58" y="208" fill="#f8fafc" font-size="17">• Shed or reduce unsafe load</text><text x="58" y="236" fill="#f8fafc" font-size="17">• Restart only for temporary relief</text><text x="58" y="264" fill="#f8fafc" font-size="17">• Protect payment idempotency</text><path d="M385 205 H425" stroke="#a3f36b" stroke-width="4"/><path d="M413 195 L425 205 L413 215" fill="none" stroke="#a3f36b" stroke-width="4"/><rect x="425" y="112" width="350" height="185" rx="12" fill="#1c2020" stroke="#fbbf24"/><text x="448" y="147" fill="#fbbf24" font-size="21" font-weight="700">2. Diagnose</text><text x="448" y="180" fill="#f8fafc" font-size="17">• Identify query, parameters and waits</text><text x="448" y="208" fill="#f8fafc" font-size="17">• Inspect execution plan and stats</text><text x="448" y="236" fill="#f8fafc" font-size="17">• Check locks, I/O and pool metrics</text><text x="448" y="264" fill="#f8fafc" font-size="17">• Validate before changing indexes</text><path d="M775 205 H815" stroke="#a3f36b" stroke-width="4"/><path d="M803 195 L815 205 L803 215" fill="none" stroke="#a3f36b" stroke-width="4"/><rect x="815" y="112" width="350" height="185" rx="12" fill="#14231e" stroke="#a3f36b"/><text x="838" y="147" fill="#a3f36b" font-size="21" font-weight="700">3. Fix and prevent</text><text x="838" y="180" fill="#f8fafc" font-size="17">• Optimize query / add proven index</text><text x="838" y="208" fill="#f8fafc" font-size="17">• Set coherent timeout budgets</text><text x="838" y="236" fill="#f8fafc" font-size="17">• Alert on query and pool waits</text><text x="838" y="264" fill="#f8fafc" font-size="17">• Load-test and document runbook</text></g><text x="35" y="320" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Trade-off: indexes cost storage and write time; larger pools can increase database contention.</text></svg>