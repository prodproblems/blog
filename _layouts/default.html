<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.scss' | relative_url }}">
    {% feed_meta %}
    {% seo %}
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav><a href="{{ '/about' | relative_url }}">About</a><a href="https://www.youtube.com/@RealProductionProblems">YouTube</a></nav>
      </div>
    </header>
    <main class="page-content"><div class="wrapper">{{ content }}</div></main>
    <footer class="site-footer"><div class="wrapper">Real engineering problems. Explained in 3 minutes. <span>Test how it fails.</span></div></footer>
  </body>
</html>
