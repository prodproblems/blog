<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Real Production Problems home">
        <span class="brand-mark">R<span>/</span>P</span>
        <span class="brand-name">REAL PRODUCTION <b>PROBLEMS</b></span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/articles/' | relative_url }}"{% if page.url contains '/articles' %} aria-current="page"{% endif %}>Articles</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a class="nav-youtube" href="https://www.youtube.com/@RealProductionProblems" target="_blank" rel="noopener">YouTube <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    <div class="content-shell{% if page.url == '/' %} home-shell{% elsif page.url contains '/articles/' and page.url != '/articles/' %} article-shell{% elsif page.url == '/articles/' %} listing-shell{% else %} reading-shell{% endif %}">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-shell">
      <a class="brand footer-brand" href="{{ '/' | relative_url }}"><span class="brand-mark">R<span>/</span>P</span><span class="brand-name">REAL PRODUCTION <b>PROBLEMS</b></span></a>
      <p>Real engineering problems. Explained in 3 minutes.</p>
      <span class="footer-tagline">TEST HOW IT FAILS.</span>
    </div>
  </footer>
</body>
</html>
